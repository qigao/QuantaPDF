name: Probe CC0 dome vector PDF for W-star
on:
  push:
    branches:
      - probe/262-pgf-corpus
    paths:
      - '.github/workflows/probe-commons-dome-vector-wstar.yml'
      - 'tools/qualification/probe_pgf_candidates.py'
      - 'tools/qualification/test_probe_pgf_candidates.py'
      - 'tests/external_wstar_candidates/commons-dome-vector-source-metadata.json'
permissions:
  contents: read
jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned discovery-only parser
        run: python3 -m pip install --disable-pip-version-check "pypdf==5.9.0"
      - name: Download unchanged Commons original and verify source SHA-1
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/commons-dome-pdf
          curl --fail --location --retry 3 --retry-all-errors --max-time 120 \
            'https://commons.wikimedia.org/wiki/Special:Redirect/file/Dome%20of%20the%20rock%20interior%20vector%2002.pdf' \
            --output '/tmp/commons-dome-pdf/Dome of the rock interior vector 02.pdf'
          file '/tmp/commons-dome-pdf/Dome of the rock interior vector 02.pdf'
          actual="$(sha1sum '/tmp/commons-dome-pdf/Dome of the rock interior vector 02.pdf' | cut -d ' ' -f 1)"
          test "$actual" = "71d7f2fd82c5e6fdba601adda6fc05736de4ca11"
      - name: Scan decoded content and preserve exact source identity
        run: |
          python3 tools/qualification/probe_pgf_candidates.py \
            --root /tmp/commons-dome-pdf \
            --output commons-dome-wstar-scan-report.json > commons-dome-wstar-scan.log
      - name: Require the candidate to be accounted for
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path("commons-dome-wstar-scan-report.json").read_text())
          assert report["files_scanned"] == 1, report["files_scanned"]
          assert report["files_scanned"] == (
              report["confirmed_no_wstar"] + report["wstar_found"] +
              report["inconclusive"]
          )
          item = report["results"][0]
          print(json.dumps({
              "file": Path(item["path"]).name,
              "bytes": item["bytes"],
              "sha256": item["sha256"],
              "scan_status": item["scan_status"],
              "reason": item["reason"],
              "pages": item["page_count"],
              "page_content_wstar_count": item["page_content_wstar_count"],
              "form_wstar_count": item["form_wstar_count"],
              "annotation_appearance_wstar_count": item["annotation_appearance_wstar_count"],
              "effective_wstar_count": item["effective_wstar_count"],
              "page_text_operator_count": item["page_text_operator_count"],
              "native_raster_risks": sorted({
                  risk for page in item["pages"]
                  for risk in page["native_raster_risks"]
              }),
              "page_operator_counts": [
                  {"page": page["index"], "operators": page["operator_counts"],
                   "risk_operators": page["risk_operator_counts"]}
                  for page in item["pages"]
              ],
              "clip_evidence": [
                  evidence for page in item["pages"]
                  for evidence in page["clip_evidence"]
              ],
          }, sort_keys=True))
          PY
      - name: Retain quarantined scan evidence and source metadata
        uses: actions/upload-artifact@v4
        with:
          name: commons-dome-wstar-scan
          path: |
            commons-dome-wstar-scan-report.json
            commons-dome-wstar-scan.log
            tests/external_wstar_candidates/commons-dome-vector-source-metadata.json
          retention-days: 7
