name: Probe quarantined PGF and LaTeX PDFs for W-star
on:
  push:
    branches:
      - probe/262-pgf-corpus
    paths:
      - '.github/workflows/probe-pgf-wstar.yml'
      - 'tools/qualification/probe_pgf_candidates.py'
      - 'tools/qualification/test_probe_pgf_candidates.py'
      - 'tests/external_wstar_candidates/pgf-source-metadata.json'
      - 'tests/external_wstar_candidates/*.pdf'
permissions:
  contents: read
jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned discovery-only parser
        run: python3 -m pip install --disable-pip-version-check "pypdf==5.9.0"
      - name: Check decoded-page, object stream and fail-closed tests
        run: python3 -m unittest discover -v -s tools/qualification -p test_probe_pgf_candidates.py
      - name: Re-evaluate all unchanged candidates
        run: python3 tools/qualification/probe_pgf_candidates.py --output pgf-wstar-scan-report.json > pgf-wstar-scan.log
      - name: Summarize conclusive and inconclusive results
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path("pgf-wstar-scan-report.json").read_text())
          assert report["files_scanned"] == 7
          assert report["files_scanned"] == (
              report["confirmed_no_wstar"] + report["wstar_found"] +
              report["inconclusive"]
          )
          print(json.dumps({
              key: report[key] for key in (
                  "files_scanned", "confirmed_no_wstar", "wstar_found", "inconclusive"
              )
          }, indent=2))
          for item in report["results"]:
              print(json.dumps({
                  "path": item["path"],
                  "scan_status": item["scan_status"],
                  "reason": item["reason"],
                  "bytes": item["bytes"],
                  "sha256": item["sha256"],
                  "page_content_wstar_count": item["page_content_wstar_count"],
                  "form_wstar_count": item["form_wstar_count"],
                  "page_text_operator_count": item["page_text_operator_count"],
                  "native_raster_risks": sorted({
                      risk for page in item["pages"]
                      for risk in page["native_raster_risks"]
                  }),
                  "page_operator_counts": [
                      {"page": page["index"], "operators": page["operator_counts"],
                       "risk_operators": page["risk_operator_counts"]}
                      for page in item["pages"]
                  ],
                  "clip_evidence": [
                      evidence for page in item["pages"]
                      for evidence in page["clip_evidence"]
                  ],
              }, sort_keys=True))
          PY
      - name: Retain quarantined evidence
        uses: actions/upload-artifact@v4
        with:
          name: pgf-wstar-decoded-scan
          path: |
            pgf-wstar-scan-report.json
            pgf-wstar-scan.log
          retention-days: 7
