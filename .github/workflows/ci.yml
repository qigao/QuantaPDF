          retention-days: 7

  windows:
    if: >-
      github.event_name == 'push' ||
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' &&
       contains(github.event.pull_request.labels.*.name, 'full-ci'))
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Restore pinned PDFium archive
        uses: actions/cache@v4
        with:
          path: build/**/_deps/downloads/pdfium-*.tgz
          key: pdfium-${{ runner.os }}-${{ runner.arch }}-${{ env.PDFIUM_RELEASE }}

      - name: Restore vcpkg binary cache
        id: vcpkg-cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/vcpkg-binary-cache
          key: vcpkg-${{ runner.os }}-${{ runner.arch }}-${{ env.VCPKG_COMMIT }}-${{ hashFiles('vcpkg.json') }}
          restore-keys: |
            vcpkg-${{ runner.os }}-${{ runner.arch }}-${{ env.VCPKG_COMMIT }}-

      - name: Configure vcpkg binary cache
        shell: pwsh
        run: |
          $cache = Join-Path $env:RUNNER_TEMP "vcpkg-binary-cache"
          New-Item -ItemType Directory -Force -Path $cache | Out-Null
          "VCPKG_DEFAULT_BINARY_CACHE=$cache" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Bootstrap pinned vcpkg
        shell: pwsh
        run: |
          $root = Join-Path $env:RUNNER_TEMP "vcpkg"
          git init $root
          git -C $root remote add origin https://github.com/microsoft/vcpkg.git
          git -C $root fetch --depth 1 origin $env:VCPKG_COMMIT
          git -C $root checkout --detach FETCH_HEAD
          & "$root\bootstrap-vcpkg.bat" -disableMetrics
          "VCPKG_ROOT=$root" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "PROJECT_ROOT=$env:RUNNER_TEMP" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Install qpdf with vcpkg
        shell: pwsh
        run: |
          & "$env:VCPKG_ROOT\vcpkg.exe" install --triplet x64-windows-static-md

      - name: Save vcpkg binary cache
        if: steps.vcpkg-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/vcpkg-binary-cache
          key: ${{ steps.vcpkg-cache.outputs.cache-primary-key }}

      - name: Locate Visual Studio developer environment
        shell: pwsh
        run: |
          $vswhere = Join-Path ${env:ProgramFiles(x86)} "Microsoft Visual Studio\Installer\vswhere.exe"
          $installation = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $installation) { throw "Visual Studio C++ toolchain not found" }
          $vsdev = Join-Path $installation "Common7\Tools\VsDevCmd.bat"
          "VSDEVCMD=$vsdev" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Configure QuantaPDF DLL
        shell: cmd
        run: call "%VSDEVCMD%" -arch=x64 -host_arch=x64 >nul && set "VCPKG_ROOT=%RUNNER_TEMP%\vcpkg" && cmake --fresh --preset win-release-user

      - name: Audit pinned PDFium artifact
        shell: pwsh
        run: |
          $root = Join-Path $env:GITHUB_WORKSPACE "build\Msvc-Release\_deps\pdfium-$env:PDFIUM_VERSION-win-x64"
          $args = Get-Content (Join-Path $root "args.gn")
          $version = Get-Content (Join-Path $root "VERSION")
          foreach ($line in @("pdf_enable_v8 = false", "pdf_enable_xfa = false", "pdf_use_partition_alloc = false")) {
            if ($args -notcontains $line) { throw "PDFium build audit failed: $line" }
          }
          foreach ($line in @("MAJOR=154", "MINOR=0", "BUILD=8021", "PATCH=0")) {
            if ($version -notcontains $line) { throw "PDFium version audit failed: $line" }
          }

      - name: Build
        shell: cmd
        run: call "%VSDEVCMD%" -arch=x64 -host_arch=x64 >nul && set "VCPKG_ROOT=%RUNNER_TEMP%\vcpkg" && cmake --build --preset win-release-user

      - name: Test
        shell: cmd
        run: call "%VSDEVCMD%" -arch=x64 -host_arch=x64 >nul && set "VCPKG_ROOT=%RUNNER_TEMP%\vcpkg" && ctest --preset win-release-user

      - name: Product conformance (Windows)
        shell: cmd
        run: call "%VSDEVCMD%" -arch=x64 -host_arch=x64 >nul && set "VCPKG_ROOT=%RUNNER_TEMP%\vcpkg" && ctest --preset win-release-user -L conformance --output-on-failure

      - name: Review original Wstar candidate typed report (Windows)
        shell: pwsh
        run: |
          Get-Content build/Msvc-Release/tests/yworks-wstar-typed-observe.json
          Get-Content build/Msvc-Release/tests/yworks-wstar-candidate-pixel.json

      - name: Upload original Wstar candidate typed evidence (Windows)
        uses: actions/upload-artifact@v4
        with:
          name: yworks-wstar-typed-candidate-windows
          path: |
            build/Msvc-Release/tests/yworks-wstar-typed-observe.json
            build/Msvc-Release/tests/yworks-wstar-candidate-pixel.json
          if-no-files-found: error
          retention-days: 7

      - name: Install Release package
        shell: cmd
        run: call "%VSDEVCMD%" -arch=x64 -host_arch=x64 >nul && set "VCPKG_ROOT=%RUNNER_TEMP%\vcpkg" && cmake --build --preset install-win-release-user

      - name: Compile installed Composer consumer
        shell: cmd
        run: |
          call "%VSDEVCMD%" -arch=x64 -host_arch=x64 >nul
          set "QP_PREFIX=%RUNNER_TEMP%\external\pkgs\quantapdf\release"
          cl /nologo /W4 /WX /std:c11 /TC tests\installed_composer_consumer.c /I"%QP_PREFIX%\include" /Fe:"%RUNNER_TEMP%\quantapdf-installed-consumer.exe" /link /LIBPATH:"%QP_PREFIX%\lib" quantapdf.lib

      - name: Run installed Composer consumer
        shell: cmd
        run: |
          set "QP_PREFIX=%RUNNER_TEMP%\external\pkgs\quantapdf\release"
          set "PATH=%QP_PREFIX%\bin;%PATH%"
          "%RUNNER_TEMP%\quantapdf-installed-consumer.exe" "tests\fixtures\fonts\Roboto-Regular.ttf" "%RUNNER_TEMP%\installed-composer-smoke-ttf.pdf"
          if not exist "%RUNNER_TEMP%\installed-composer-smoke-ttf.pdf" exit /b 1
          "%RUNNER_TEMP%\quantapdf-installed-consumer.exe" "tests\fixtures\fonts\SourceSans3-Regular.otf" "%RUNNER_TEMP%\installed-composer-smoke-cff.pdf"
          if not exist "%RUNNER_TEMP%\installed-composer-smoke-cff.pdf" exit /b 1
          "%RUNNER_TEMP%\quantapdf-installed-consumer.exe" "tests\fixtures\fonts\SourceSans3VF-Upright.otf" "%RUNNER_TEMP%\installed-composer-smoke-cff2.pdf"
          if not exist "%RUNNER_TEMP%\installed-composer-smoke-cff2.pdf" exit /b 1

      - name: Review quarantined W-only original typed observations (Windows)
        shell: pwsh
        run: |
          Get-Content build/Msvc-Release/tests/external-yworks-svg-nested-w-typed-observe.json
          Get-Content build/Msvc-Release/tests/external-yworks-svg-nested-w-budget8-typed-observe.json
          Get-Content build/Msvc-Release/tests/external-yworks-svg-w-stage-diagnostic.json
          Get-Content build/Msvc-Release/tests/external-yworks-hidden-w-typed-observe.json
          Get-Content build/Msvc-Release/tests/external-jspdf-w3s-clip-typed-observe.json

      - name: Upload quarantined W-only original typed evidence (Windows)
        uses: actions/upload-artifact@v4
        with:
          name: quarantined-nonzero-typed-observe-windows
          path: |
            build/Msvc-Release/tests/external-yworks-svg-nested-w-typed-observe.json
            build/Msvc-Release/tests/external-yworks-svg-nested-w-budget8-typed-observe.json
            build/Msvc-Release/tests/external-yworks-svg-w-stage-diagnostic.json
            build/Msvc-Release/tests/external-yworks-hidden-w-typed-observe.json
            build/Msvc-Release/tests/external-jspdf-w3s-clip-typed-observe.json
          if-no-files-found: error
          retention-days: 7

      - name: Review quarantined hidden W original pixel parity (Windows)
