name: QuantaPDF Native CI

on:
  push:
    branches: [master]
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  workflow_dispatch:

permissions:
  contents: read
  packages: read

concurrency:
  group: native-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  native:
    name: LLVM / ${{ matrix.rid }} / ${{ matrix.preset }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - {rid: linux-x64, runner: ubuntu-24.04, triplet: x64-linux, preset: ci-native, shared: "OFF"}
          - {rid: linux-x64, runner: ubuntu-24.04, triplet: x64-linux, preset: ci-asan-ubsan, shared: "OFF"}
          - {rid: macos-arm64, runner: macos-15, triplet: arm64-osx, preset: ci-native, shared: "OFF"}
          - {rid: windows-x64, runner: windows-2025, triplet: qigao-x64-windows-llvm-mingw, preset: ci-native, shared: "ON"}
    env:
      VCPKG_DOWNLOADS: ${{ github.workspace }}/build/vcpkg-downloads
      VCPKG_BINARY_CACHE: ${{ github.workspace }}/build/vcpkg-binary-cache
      CCACHE_VERSION: 4.14.2
      CCACHE_DIR: ${{ github.workspace }}/build/ccache
      CCACHE_MAXSIZE: 512MiB
      CCACHE_COMPILERCHECK: content
      CMAKE_BUILD_PARALLEL_LEVEL: 2
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Prepare dependency cache directories
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path $env:VCPKG_DOWNLOADS, $env:VCPKG_BINARY_CACHE | Out-Null

      # Fixed curl-only infrastructure revision: the older cache action and
      # compiler download helpers used Mono/NuGet or non-curl downloaders.
      - name: Set up runner LLVM
        if: runner.os != 'Windows'
        uses: qigao/vcpkg-cache/.github/actions/setup-llvm-native@6672559950946f9b11eab6e4c06d211b53b3eebc
        with:
          build-type: toolchain-only
          obfuscator: "false"

      - name: Set up Windows LLVM-MinGW
        id: windows-llvm
        if: runner.os == 'Windows'
        uses: qigao/vcpkg-cache/.github/actions/setup-llvm-mingw@6672559950946f9b11eab6e4c06d211b53b3eebc
        with:
          target: x64
          build-type: toolchain-only
          obfuscator: "false"

      - name: Set up pinned dependencies and curl transport
        id: vcpkg
        uses: qigao/vcpkg-cache/.github/actions/setup-vcpkg-curl-cache@6672559950946f9b11eab6e4c06d211b53b3eebc
        with:
          mode: read
          # A product cache miss builds its pinned source into the local files
          # cache. Do not require an unpublished exact GitHub Packages ABI.
          restore-packages: "false"
          triplet: ${{ matrix.triplet }}
          host-triplet: ${{ matrix.triplet }}
          token: ${{ github.token }}

      - name: Select native build inputs
        id: build-inputs
        shell: pwsh
        env:
          TOOLCHAIN: ${{ steps.vcpkg.outputs.toolchain_file }}
        run: |
          "QUANTAPDF_CI_TOOLCHAIN_FILE=$env:TOOLCHAIN" >> $env:GITHUB_ENV
          'QUANTAPDF_CI_TRIPLET=${{ matrix.triplet }}' >> $env:GITHUB_ENV
          'QUANTAPDF_CI_SHARED=${{ matrix.shared }}' >> $env:GITHUB_ENV
          "runner-image=$env:ImageOS-$env:ImageVersion" >> $env:GITHUB_OUTPUT
          if ($IsWindows) {
            (Join-Path $env:GITHUB_WORKSPACE 'vcpkg_installed/${{ matrix.triplet }}/bin') >> $env:GITHUB_PATH
          }

      - name: Restore dependencies and source downloads
        id: dependencies
        uses: actions/cache/restore@v4
        with:
          path: |
            ${{ env.VCPKG_BINARY_CACHE }}
            ${{ env.VCPKG_DOWNLOADS }}
          key: native-deps-v2-${{ runner.os }}-${{ runner.arch }}-${{ matrix.triplet }}-${{ steps.vcpkg.outputs.cache_revision }}-${{ steps.build-inputs.outputs.runner-image }}-${{ steps.windows-llvm.outputs.version }}-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json') }}
          restore-keys: |
            native-deps-v2-${{ runner.os }}-${{ runner.arch }}-${{ matrix.triplet }}-${{ steps.vcpkg.outputs.cache_revision }}-

      - name: Install native ccache with curl
        shell: pwsh
        run: ./.github/scripts/setup-ccache.ps1

      - name: Restore compiler cache
        id: compiler-cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ccache-${{ env.CCACHE_VERSION }}-${{ matrix.rid }}-${{ matrix.preset }}-${{ steps.dependencies.outputs.cache-primary-key }}-${{ github.sha }}
          restore-keys: |
            ccache-${{ env.CCACHE_VERSION }}-${{ matrix.rid }}-${{ matrix.preset }}-${{ steps.dependencies.outputs.cache-primary-key }}-

      - name: Configure native library and tests
        run: |
          ccache --zero-stats
          cmake --preset ${{ matrix.preset }}

      # Preserve built dependencies even when a later project test fails.
      - name: Save dependencies and source downloads
        if: steps.dependencies.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            ${{ env.VCPKG_BINARY_CACHE }}
            ${{ env.VCPKG_DOWNLOADS }}
          key: ${{ steps.dependencies.outputs.cache-primary-key }}

      - name: Build native library and tests
        id: build
        run: cmake --build --preset ${{ matrix.preset }}

      - name: Report compiler cache statistics
        if: always() && steps.build.outcome != '' && steps.build.outcome != 'skipped'
        run: ccache --show-stats --verbose

      - name: Save compiler cache
        if: always() && steps.build.outcome == 'success' && steps.compiler-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ${{ steps.compiler-cache.outputs.cache-primary-key }}

      - name: Run native CTest suite
        run: ctest --preset ${{ matrix.preset }}

      - name: Verify exact Windows DLL export ABI
        if: runner.os == 'Windows'
        run: >-
          cmake -DQUANTAPDF_LLVM_READOBJ=llvm-readobj
          -DQUANTAPDF_LIBRARY=build/${{ matrix.preset }}/libquantapdf.dll
          -DQUANTAPDF_EXPORT_BASELINE=abi/quantapdf-v2.exports
          -P cmake/CheckQuantaPDFExports.cmake
