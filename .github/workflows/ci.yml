name: QuantaPDF CI

on:
  push:
    branches:
      - master
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - labeled
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quantapdf-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

env:
  VCPKG_COMMIT: f74a2eade17a628413746557d04db25ccf6e76f9
  PDFIUM_RELEASE: chromium-8021
  PDFIUM_VERSION: 154.0.8021.0

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Restore pinned PDFium archive
        uses: actions/cache@v4
        with:
          path: build/**/_deps/downloads/pdfium-*.tgz
          key: pdfium-${{ runner.os }}-${{ runner.arch }}-${{ env.PDFIUM_RELEASE }}

      - name: Restore vcpkg binary cache
        id: vcpkg-cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/vcpkg-binary-cache
          key: vcpkg-${{ runner.os }}-${{ runner.arch }}-${{ env.VCPKG_COMMIT }}-${{ hashFiles('vcpkg.json') }}
          restore-keys: |
            vcpkg-${{ runner.os }}-${{ runner.arch }}-${{ env.VCPKG_COMMIT }}-

      - name: Configure vcpkg binary cache
        shell: bash
        run: |
          mkdir -p "${{ runner.temp }}/vcpkg-binary-cache"
          echo "VCPKG_DEFAULT_BINARY_CACHE=${{ runner.temp }}/vcpkg-binary-cache" >> "$GITHUB_ENV"

      - name: Bootstrap pinned vcpkg
        shell: bash
        run: |
          git init "$RUNNER_TEMP/vcpkg"
          git -C "$RUNNER_TEMP/vcpkg" remote add origin https://github.com/microsoft/vcpkg.git
          git -C "$RUNNER_TEMP/vcpkg" fetch --depth 1 origin "$VCPKG_COMMIT"
          git -C "$RUNNER_TEMP/vcpkg" checkout --detach FETCH_HEAD
          "$RUNNER_TEMP/vcpkg/bootstrap-vcpkg.sh" -disableMetrics
          echo "VCPKG_ROOT=$RUNNER_TEMP/vcpkg" >> "$GITHUB_ENV"
          echo "PROJECT_ROOT=$RUNNER_TEMP" >> "$GITHUB_ENV"

      - name: Install qpdf with vcpkg
        shell: bash
        run: |
          "$VCPKG_ROOT/vcpkg" install --triplet x64-linux

      - name: Save vcpkg binary cache
        if: steps.vcpkg-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/vcpkg-binary-cache
          key: ${{ steps.vcpkg-cache.outputs.cache-primary-key }}

      - name: Configure static build
        shell: bash
        run: cmake --fresh --preset linux-release-user

      - name: Audit pinned PDFium artifact
        shell: bash
        run: |
          root="build/linux-gcc-release/_deps/pdfium-${PDFIUM_VERSION}-linux-x64"
          grep -Fxq 'pdf_enable_v8 = false' "$root/args.gn"
          grep -Fxq 'pdf_enable_xfa = false' "$root/args.gn"
          grep -Fxq 'pdf_use_partition_alloc = false' "$root/args.gn"
          grep -Fxq 'MAJOR=154' "$root/VERSION"
          grep -Fxq 'MINOR=0' "$root/VERSION"
          grep -Fxq 'BUILD=8021' "$root/VERSION"
          grep -Fxq 'PATCH=0' "$root/VERSION"

      - name: Build static library and tests
        run: cmake --build --preset linux-release-user --parallel 2

      - name: Test static build
        run: ctest --preset linux-release-user

      - name: Product conformance (Linux Release)
        run: ctest --preset linux-release-user -L conformance --output-on-failure

      - name: Install static SDK
        run: cmake --build --preset install-linux-release-user --parallel 2

      - name: Qualify CFF2 with Poppler
        shell: bash
        run: |
          if ! command -v pdftotext >/dev/null 2>&1 || ! command -v pdffonts >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y poppler-utils
          fi
          pdf="$(find build/linux-gcc-release -name composer-cff2-output.pdf -print -quit)"
          test -n "$pdf"
          test -s "$pdf"
          pdffonts "$pdf" | tee "$RUNNER_TEMP/cff2-pdffonts.txt"
          grep -Fq "SourceSans" "$RUNNER_TEMP/cff2-pdffonts.txt"
          pdftotext "$pdf" "$RUNNER_TEMP/cff2-poppler.txt"
          grep -Fq "CFF Caf" "$RUNNER_TEMP/cff2-poppler.txt"
          grep -Fq "AV" "$RUNNER_TEMP/cff2-poppler.txt"

      - name: Configure sanitizer build
        shell: bash
        run: cmake --fresh --preset linux-dev-user

      - name: Audit sanitizer PDFium artifact
        shell: bash
        run: |
          root="build/linux-gcc-debug/_deps/pdfium-${PDFIUM_VERSION}-linux-x64"
          grep -Fxq 'pdf_enable_v8 = false' "$root/args.gn"
          grep -Fxq 'pdf_enable_xfa = false' "$root/args.gn"
          grep -Fxq 'pdf_use_partition_alloc = false' "$root/args.gn"
          grep -Fxq 'BUILD=8021' "$root/VERSION"

      - name: Build sanitizer configuration
        run: cmake --build --preset linux-dev-user --parallel 2

      - name: Test sanitizer configuration
        run: ctest --preset linux-dev-user

      - name: Product conformance (Linux ASan/UBSan)
        run: ctest --preset linux-dev-user -L conformance --output-on-failure

      - name: Review original Wstar candidate typed report (Linux)
        shell: bash
        run: |
          cat build/linux-gcc-release/tests/yworks-wstar-typed-observe.json
          cat build/linux-gcc-debug/tests/yworks-wstar-typed-observe.json
          cat build/linux-gcc-release/tests/yworks-wstar-candidate-pixel.json
          cat build/linux-gcc-debug/tests/yworks-wstar-candidate-pixel.json

      - name: Upload original Wstar candidate typed evidence (Linux)
        uses: actions/upload-artifact@v4
        with:
          name: yworks-wstar-typed-candidate-linux
          path: |
            build/linux-gcc-release/tests/yworks-wstar-typed-observe.json
            build/linux-gcc-debug/tests/yworks-wstar-typed-observe.json
            build/linux-gcc-release/tests/yworks-wstar-candidate-pixel.json
            build/linux-gcc-debug/tests/yworks-wstar-candidate-pixel.json
          if-no-files-found: error
          retention-days: 7

      - name: Review quarantined W-only original typed observations (Linux)
        shell: bash
        run: |
          cat build/linux-gcc-release/tests/external-yworks-svg-nested-w-typed-observe.json
          cat build/linux-gcc-release/tests/external-yworks-svg-nested-w-budget8-typed-observe.json
          cat build/linux-gcc-release/tests/external-yworks-svg-w-stage-diagnostic.json
          cat build/linux-gcc-release/tests/external-yworks-hidden-w-typed-observe.json
          cat build/linux-gcc-release/tests/external-jspdf-w3s-clip-typed-observe.json
          cat build/linux-gcc-debug/tests/external-yworks-svg-nested-w-typed-observe.json
          cat build/linux-gcc-debug/tests/external-yworks-svg-nested-w-budget8-typed-observe.json
          cat build/linux-gcc-debug/tests/external-yworks-svg-w-stage-diagnostic.json
          cat build/linux-gcc-debug/tests/external-yworks-hidden-w-typed-observe.json
          cat build/linux-gcc-debug/tests/external-jspdf-w3s-clip-typed-observe.json

      - name: Upload quarantined W-only original typed evidence (Linux)
        uses: actions/upload-artifact@v4
        with:
          name: quarantined-nonzero-typed-observe-linux
          path: |
            build/linux-gcc-release/tests/external-yworks-svg-nested-w-typed-observe.json
            build/linux-gcc-release/tests/external-yworks-svg-nested-w-budget8-typed-observe.json
            build/linux-gcc-release/tests/external-yworks-svg-w-stage-diagnostic.json
            build/linux-gcc-release/tests/external-yworks-hidden-w-typed-observe.json
            build/linux-gcc-release/tests/external-jspdf-w3s-clip-typed-observe.json
            build/linux-gcc-debug/tests/external-yworks-svg-nested-w-typed-observe.json
            build/linux-gcc-debug/tests/external-yworks-svg-nested-w-budget8-typed-observe.json
            build/linux-gcc-debug/tests/external-yworks-svg-w-stage-diagnostic.json
            build/linux-gcc-debug/tests/external-yworks-hidden-w-typed-observe.json
            build/linux-gcc-debug/tests/external-jspdf-w3s-clip-typed-observe.json
          if-no-files-found: error
          retention-days: 7

      - name: Review quarantined hidden W original pixel parity (Linux)
        shell: bash
        run: |
          cat build/linux-gcc-release/tests/yworks-hidden-w-candidate-pixel.json
          cat build/linux-gcc-debug/tests/yworks-hidden-w-candidate-pixel.json

      - name: Upload quarantined hidden W pixel evidence (Linux)
        uses: actions/upload-artifact@v4
        with:
          name: quarantined-hidden-w-pixel-linux
          path: |
            build/linux-gcc-release/tests/yworks-hidden-w-candidate-pixel.json
            build/linux-gcc-debug/tests/yworks-hidden-w-candidate-pixel.json
          if-no-files-found: error
          retention-days: 7

      - name: Review candidate complex W original pixel parity (Linux)
        shell: bash
        run: |
          cat build/linux-gcc-release/tests/yworks-svg-w-candidate-pixel.json
          cat build/linux-gcc-debug/tests/yworks-svg-w-candidate-pixel.json

      - name: Upload candidate complex W native pixel evidence (Linux)
        uses: actions/upload-artifact@v4
        with:
          name: quarantined-svg-w-native-linux
          path: |
            build/linux-gcc-release/tests/yworks-svg-w-candidate-pixel.json
            build/linux-gcc-debug/tests/yworks-svg-w-candidate-pixel.json
          if-no-files-found: error
          retention-days: 7

      - name: Review independent jsPDF fractional page rejection (Linux)
        shell: bash
        run: |
          cat build/linux-gcc-release/tests/external-jspdf-fractional-page-native.json
          cat build/linux-gcc-debug/tests/external-jspdf-fractional-page-native.json
          cat build/linux-gcc-release/tests/original-jspdf-stroke-phase-ab.json
          cat build/linux-gcc-release/tests/external-jspdf-single-vertical-analytic-ab.json
          cat build/linux-gcc-debug/tests/original-jspdf-stroke-phase-ab.json
          cat build/linux-gcc-debug/tests/external-jspdf-single-vertical-analytic-ab.json

      - name: Upload independent jsPDF fractional page rejection (Linux)
        uses: actions/upload-artifact@v4
        with:
          name: quarantined-jspdf-fractional-linux
          path: |
            build/linux-gcc-release/tests/external-jspdf-fractional-page-native.json
            build/linux-gcc-debug/tests/external-jspdf-fractional-page-native.json
            build/linux-gcc-release/tests/original-jspdf-stroke-phase-ab.json
            build/linux-gcc-release/tests/external-jspdf-single-vertical-analytic-ab.json
            build/linux-gcc-debug/tests/original-jspdf-stroke-phase-ab.json
            build/linux-gcc-debug/tests/external-jspdf-single-vertical-analytic-ab.json
          if-no-files-found: error
          retention-days: 7

      - name: Qualify external PDF corpus admission (Linux)
        shell: bash
        run: |
          python3 -m unittest discover -s tests -p test_external_pdf_corpus.py
          python3 -m unittest discover -s tests -p test_screen_external_wstar.py
          python3 tools/qualification/external_pdf_corpus.py \
            --manifest tests/external_source_corpus/manifest.json \
            --assets tests/external_source_corpus/documents \
            --report "${{ runner.temp }}/external-pdf-corpus.json"

      - name: Upload external PDF corpus admission (Linux)
        uses: actions/upload-artifact@v4
        with:
          name: external-corpus-admission-linux
          path: ${{ runner.temp }}/external-pdf-corpus.json
          if-no-files-found: error
          retention-days: 7

      - name: Reconcile external source conformance (Linux)
        shell: bash
        run: |
          python3 -m unittest discover -s tests -p test_external_corpus_reconcile.py
          python3 tools/qualification/reconcile_external_corpus.py --admission "${{ runner.temp }}/external-pdf-corpus.json" --text "build/linux-gcc-release/tests/external-cc0-text-status.json" --blank "build/linux-gcc-release/tests/external-cc0-blank-status.json" --path "build/linux-gcc-release/tests/external-pdfium-black-path-status.json" --clip "build/linux-gcc-release/tests/external-pdfium-clip-stroke-status.json" --wstar-text "build/linux-gcc-release/tests/external-pdfium-wstar-text-status.json" --wstar-native "build/linux-gcc-release/tests/external-yworks-wstar-native-status.json" --output "${{ runner.temp }}/external-corpus-reconciled.json"

      - name: Upload admitted original Wstar native oracle (Linux)
        uses: actions/upload-artifact@v4
        with:
          name: external-wstar-native-linux
          path: |
            build/linux-gcc-release/tests/external-yworks-wstar-native-status.json
            build/linux-gcc-debug/tests/external-yworks-wstar-native-status.json
          if-no-files-found: error
          retention-days: 7

      - name: Upload reconciled external corpus (Linux)
        uses: actions/upload-artifact@v4
        with:
          name: external-corpus-reconciled-linux
          path: ${{ runner.temp }}/external-corpus-reconciled.json
          if-no-files-found: error
          retention-days: 7

      - name: Upload external W Clip + stroke native oracle (Linux)
        uses: actions/upload-artifact@v4
        with:
          name: external-clipped-stroke-native-linux
          path: |
            build/linux-gcc-release/tests/external-pdfium-clip-stroke-status.json
            build/linux-gcc-release/tests/external-original-w-preflight.json
            build/linux-gcc-debug/tests/external-pdfium-clip-stroke-status.json
            build/linux-gcc-debug/tests/external-original-w-preflight.json
          if-no-files-found: error
          retention-days: 7

      - name: Upload original W* late-text negative (Linux)
        uses: actions/upload-artifact@v4
        with:
          name: external-wstar-late-text-negative-linux
          path: |
            build/linux-gcc-release/tests/external-pdfium-wstar-text-status.json
            build/linux-gcc-release/tests/external-original-wstar-preflight.json
            build/linux-gcc-debug/tests/external-pdfium-wstar-text-status.json
            build/linux-gcc-debug/tests/external-original-wstar-preflight.json
          if-no-files-found: error
          retention-days: 7

      - name: Upload external opaque PATH native oracle (Linux)
        uses: actions/upload-artifact@v4
        with:
          name: external-opaque-path-native-linux
          path: |
            build/linux-gcc-release/tests/external-pdfium-black-path-status.json
            build/linux-gcc-debug/tests/external-pdfium-black-path-status.json
          if-no-files-found: error
          retention-days: 7

      - name: Upload external blank-page native oracle (Linux)
        uses: actions/upload-artifact@v4
        with:
          name: external-blank-native-linux
          path: |
            build/linux-gcc-release/tests/external-cc0-blank-status.json
            build/linux-gcc-debug/tests/external-cc0-blank-status.json
          if-no-files-found: error
          retention-days: 7

      - name: Upload external CC0 semantic report (Linux)
        uses: actions/upload-artifact@v4
        with:
          name: external-source-semantic-linux
          path: |
            build/linux-gcc-release/tests/external-cc0-text-status.json
            build/linux-gcc-debug/tests/external-cc0-text-status.json
          if-no-files-found: error
          retention-days: 7

      - name: Upload source-PDF corpus reports (Linux)
        uses: actions/upload-artifact@v4
        with:
          name: source-corpus-linux
          path: |
            build/linux-gcc-release/tests/native-source-corpus.json
            build/linux-gcc-debug/tests/native-source-corpus.json
          if-no-files-found: error
          retention-days: 7

      # #269: test-GENERATED original source pixel observations only.
      # Separate from externally licensed source-conformance counts.
      - name: Review generated visible-page RGB metrics (Linux)
        shell: bash
        run: |
          cat build/linux-gcc-release/tests/generated-visible-page-rgb-report.json
          cat build/linux-gcc-debug/tests/generated-visible-page-rgb-report.json

      - name: Upload generated visible-page RGB metrics (Linux)
        uses: actions/upload-artifact@v4
        with:
          name: generated-visible-rgb-linux
          path: |
            build/linux-gcc-release/tests/generated-visible-page-rgb-report.json
            build/linux-gcc-debug/tests/generated-visible-page-rgb-report.json
          if-no-files-found: error
          retention-days: 7

      # #269: independently published original pypdf PDF, quarantine only.
      # Byte integrity and selected-page typed observation, no pixel count.
      - name: Review quarantined pypdf original geometry (Linux)
        shell: bash
        run: |
          for configuration in build/linux-gcc-release build/linux-gcc-debug; do
            cat "$configuration/tests/external-pypdf-rotcrop-raw-geometry.json"
            cat "$configuration/tests/external-pypdf-rotcrop-graph-device.json"
            cat "$configuration/tests/external-pypdf-capture-stage-matrix.json"
            cat "$configuration/tests/external-pypdf-original-pdfium-dimensions.json"
            for page in 0 1 2 3; do
              cat "$configuration/tests/external-pypdf-rotcrop-page${page}-typed-observe.json"
            done
          done

      - name: Upload quarantined pypdf geometry observations (Linux)
        uses: actions/upload-artifact@v4
        with:
          name: quarantine-pypdf-rotcrop-linux
          path: |
            build/linux-gcc-release/tests/external-pypdf-rotcrop-raw-geometry.json
            build/linux-gcc-release/tests/external-pypdf-rotcrop-graph-device.json
            build/linux-gcc-release/tests/external-pypdf-capture-stage-matrix.json
            build/linux-gcc-release/tests/external-pypdf-original-pdfium-dimensions.json
            build/linux-gcc-release/tests/external-pypdf-rotcrop-page*-typed-observe.json
            build/linux-gcc-debug/tests/external-pypdf-rotcrop-raw-geometry.json
            build/linux-gcc-debug/tests/external-pypdf-rotcrop-graph-device.json
            build/linux-gcc-debug/tests/external-pypdf-capture-stage-matrix.json
            build/linux-gcc-debug/tests/external-pypdf-original-pdfium-dimensions.json
            build/linux-gcc-debug/tests/external-pypdf-rotcrop-page*-typed-observe.json
          if-no-files-found: error
          retention-days: 7

      # #269: strict four ORIGINAL test-generated UserUnit7 Fill/W Clip pages;
      # never a licensed independent publisher-source positive.
      - name: Review generated original UserUnit7 RGB parity (Linux)
        shell: bash
        run: |
          cat build/linux-gcc-release/tests/generated-small-unit7-original-rgb.json
          cat build/linux-gcc-debug/tests/generated-small-unit7-original-rgb.json

      - name: Upload generated original UserUnit7 RGB parity (Linux)
        uses: actions/upload-artifact@v4
        with:
          name: generated-userunit7-original-linux
          path: |
            build/linux-gcc-release/tests/generated-small-unit7-original-rgb.json
            build/linux-gcc-debug/tests/generated-small-unit7-original-rgb.json
          if-no-files-found: error
          retention-days: 7

      - name: Review generated oversized UserUnit7 original source refusal (Linux)
        shell: bash
        run: |
          cat build/linux-gcc-release/tests/generated-oversize-unit7-source-refusal.json
          cat build/linux-gcc-debug/tests/generated-oversize-unit7-source-refusal.json
      - name: Upload generated oversized UserUnit7 original source refusal (Linux)
        uses: actions/upload-artifact@v4
        with:
          name: generated-oversize-unit7-source-linux
          path: |
            build/linux-gcc-release/tests/generated-oversize-unit7-source-refusal.json
            build/linux-gcc-debug/tests/generated-oversize-unit7-source-refusal.json
          if-no-files-found: error
          retention-days: 7

      - name: Review generated Unit7 multi-DPI original RGB diagnostics (Linux)
        shell: bash
        run: |
          cat build/linux-gcc-release/tests/generated-unit7-multidpi-diagnostic.json
          cat build/linux-gcc-debug/tests/generated-unit7-multidpi-diagnostic.json
      - name: Upload generated Unit7 multi-DPI original RGB diagnostics (Linux)
        uses: actions/upload-artifact@v4
        with:
          name: generated-unit7-multidpi-linux
          path: |
            build/linux-gcc-release/tests/generated-unit7-multidpi-diagnostic.json
            build/linux-gcc-debug/tests/generated-unit7-multidpi-diagnostic.json
          if-no-files-found: error
          retention-days: 7

      - name: Review generated Unit7 original CropBox shift diagnostics (Linux)
        shell: bash
        run: |
          cat build/linux-gcc-release/tests/generated-unit7-crop-shift.json
          cat build/linux-gcc-debug/tests/generated-unit7-crop-shift.json

      - name: Upload generated Unit7 original CropBox shift diagnostics (Linux)
        uses: actions/upload-artifact@v4
        with:
          name: generated-unit7-crop-shift-linux
          path: |
            build/linux-gcc-release/tests/generated-unit7-crop-shift.json
            build/linux-gcc-debug/tests/generated-unit7-crop-shift.json
          if-no-files-found: error
          retention-days: 7

      - name: Review PDFium original Fill and W Clip mask decomposition (Linux)
        shell: bash
        run: |
          cat build/linux-gcc-release/tests/generated-unit7-pdfium-mask-decomposition.json
          cat build/linux-gcc-debug/tests/generated-unit7-pdfium-mask-decomposition.json

      - name: Upload PDFium original Fill and W Clip mask decomposition (Linux)
        uses: actions/upload-artifact@v4
        with:
          name: generated-unit7-pdfium-mask-decomp-linux
          path: |
            build/linux-gcc-release/tests/generated-unit7-pdfium-mask-decomposition.json
            build/linux-gcc-debug/tests/generated-unit7-pdfium-mask-decomposition.json
          if-no-files-found: error
          retention-days: 7

      - name: Review PDFium original Fill-only held-out extents (Linux)
        shell: bash
        run: |
          cat build/linux-gcc-release/tests/generated-unit7-fill-extent-heldout.json
          cat build/linux-gcc-debug/tests/generated-unit7-fill-extent-heldout.json

      - name: Upload PDFium original Fill-only held-out extents (Linux)
        uses: actions/upload-artifact@v4
        with:
          name: generated-unit7-fill-extent-linux
          path: |
            build/linux-gcc-release/tests/generated-unit7-fill-extent-heldout.json
            build/linux-gcc-debug/tests/generated-unit7-fill-extent-heldout.json
          if-no-files-found: error
          retention-days: 7

      - name: Review fixed-original Unit7 Fill multi-DPI report (Linux)
        shell: bash
        run: |
          cat build/linux-gcc-release/tests/generated-unit7-fill-dpi-heldout.json
          cat build/linux-gcc-debug/tests/generated-unit7-fill-dpi-heldout.json

      - name: Upload fixed-original Unit7 Fill multi-DPI report (Linux)
        uses: actions/upload-artifact@v4
        with:
          name: generated-unit7-fill-dpi-linux
          path: |
            build/linux-gcc-release/tests/generated-unit7-fill-dpi-heldout.json
            build/linux-gcc-debug/tests/generated-unit7-fill-dpi-heldout.json
          if-no-files-found: error
          retention-days: 7

  macos:
    if: >-
      github.event_name == 'push' ||
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' &&
       contains(github.event.pull_request.labels.*.name, 'full-ci'))
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Restore pinned PDFium archive
        uses: actions/cache@v4
        with:
          path: build/**/_deps/downloads/pdfium-*.tgz
          key: pdfium-${{ runner.os }}-${{ runner.arch }}-${{ env.PDFIUM_RELEASE }}

      - name: Restore vcpkg binary cache
        id: vcpkg-cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/vcpkg-binary-cache
          key: vcpkg-${{ runner.os }}-${{ runner.arch }}-${{ env.VCPKG_COMMIT }}-${{ hashFiles('vcpkg.json') }}
          restore-keys: |
            vcpkg-${{ runner.os }}-${{ runner.arch }}-${{ env.VCPKG_COMMIT }}-

      - name: Configure vcpkg binary cache
        shell: bash
        run: |
          mkdir -p "${{ runner.temp }}/vcpkg-binary-cache"
          echo "VCPKG_DEFAULT_BINARY_CACHE=${{ runner.temp }}/vcpkg-binary-cache" >> "$GITHUB_ENV"

      - name: Bootstrap pinned vcpkg
        shell: bash
        run: |
          git init "$RUNNER_TEMP/vcpkg"
          git -C "$RUNNER_TEMP/vcpkg" remote add origin https://github.com/microsoft/vcpkg.git
          git -C "$RUNNER_TEMP/vcpkg" fetch --depth 1 origin "$VCPKG_COMMIT"
          git -C "$RUNNER_TEMP/vcpkg" checkout --detach FETCH_HEAD
          "$RUNNER_TEMP/vcpkg/bootstrap-vcpkg.sh" -disableMetrics
          echo "VCPKG_ROOT=$RUNNER_TEMP/vcpkg" >> "$GITHUB_ENV"
          echo "PROJECT_ROOT=$RUNNER_TEMP" >> "$GITHUB_ENV"

      - name: Select vcpkg triplet
        shell: bash
        run: |
          case "$(uname -m)" in
            arm64) triplet=arm64-osx; preset=macos-arm64-release-user; pdfium=mac-arm64 ;;
            x86_64) triplet=x64-osx; preset=macos-x64-release-user; pdfium=mac-x64 ;;
            *) echo "Unsupported macOS architecture: $(uname -m)" >&2; exit 1 ;;
          esac
          echo "VCPKG_TRIPLET=$triplet" >> "$GITHUB_ENV"
          echo "CMAKE_PRESET=$preset" >> "$GITHUB_ENV"
          echo "PDFIUM_PLATFORM=$pdfium" >> "$GITHUB_ENV"

      - name: Install qpdf with vcpkg
        shell: bash
        run: |
          "$VCPKG_ROOT/vcpkg" install --triplet "$VCPKG_TRIPLET"

      - name: Save vcpkg binary cache
        if: steps.vcpkg-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/vcpkg-binary-cache
          key: ${{ steps.vcpkg-cache.outputs.cache-primary-key }}

      - name: Configure
        shell: bash
        run: cmake --fresh --preset "$CMAKE_PRESET"

      - name: Audit pinned PDFium artifact
        shell: bash
        run: |
          root="build/macos-clang-release/_deps/pdfium-${PDFIUM_VERSION}-${PDFIUM_PLATFORM}"
          grep -Fxq 'pdf_enable_v8 = false' "$root/args.gn"
          grep -Fxq 'pdf_enable_xfa = false' "$root/args.gn"
          grep -Fxq 'pdf_use_partition_alloc = false' "$root/args.gn"
          grep -Fxq 'MAJOR=154' "$root/VERSION"
          grep -Fxq 'MINOR=0' "$root/VERSION"
          grep -Fxq 'BUILD=8021' "$root/VERSION"
          grep -Fxq 'PATCH=0' "$root/VERSION"

      - name: Build
        run: cmake --build --preset "$CMAKE_PRESET" --parallel 2

      - name: Test
        run: ctest --preset "$CMAKE_PRESET"

      - name: Product conformance (macOS)
        run: ctest --preset "$CMAKE_PRESET" -L conformance --output-on-failure

      - name: Install SDK
        run: cmake --build --preset "install-$CMAKE_PRESET" --parallel 2

      - name: Review original Wstar candidate typed report (macOS)
        shell: bash
        run: |
          cat build/macos-clang-release/tests/yworks-wstar-typed-observe.json
          cat build/macos-clang-release/tests/yworks-wstar-candidate-pixel.json

      - name: Upload original Wstar candidate typed evidence (macOS)
