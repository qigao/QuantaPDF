name: QuantaPDF Native CI

on:
  push:
    branches:
      - master
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - labeled
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

env:
  VCPKG_COMMIT: f74a2eade17a628413746557d04db25ccf6e76f9

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore vcpkg binary cache
        id: vcpkg-cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/vcpkg-binary-cache
          key: vcpkg-native-${{ runner.os }}-${{ runner.arch }}-${{ env.VCPKG_COMMIT }}-${{ hashFiles('vcpkg.json') }}
      - name: Configure vcpkg binary cache
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/vcpkg-binary-cache"
          echo "VCPKG_DEFAULT_BINARY_CACHE=$RUNNER_TEMP/vcpkg-binary-cache" >> "$GITHUB_ENV"
      - name: Bootstrap pinned vcpkg
        shell: bash
        run: |
          git init "$RUNNER_TEMP/vcpkg"
          git -C "$RUNNER_TEMP/vcpkg" remote add origin https://github.com/microsoft/vcpkg.git
          git -C "$RUNNER_TEMP/vcpkg" fetch --depth 1 origin "$VCPKG_COMMIT"
          git -C "$RUNNER_TEMP/vcpkg" checkout --detach FETCH_HEAD
          "$RUNNER_TEMP/vcpkg/bootstrap-vcpkg.sh" -disableMetrics
          echo "VCPKG_ROOT=$RUNNER_TEMP/vcpkg" >> "$GITHUB_ENV"
          echo "PROJECT_ROOT=$RUNNER_TEMP" >> "$GITHUB_ENV"
      - name: Install qpdf
        shell: bash
        run: |
          "$VCPKG_ROOT/vcpkg" install --triplet x64-linux
      - name: Save vcpkg binary cache
        if: steps.vcpkg-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/vcpkg-binary-cache
          key: ${{ steps.vcpkg-cache.outputs.cache-primary-key }}
      - name: Native Release configure
        run: cmake --fresh --preset linux-release-user
      - name: Native Release build
        run: cmake --build --preset linux-release-user --parallel 2
      - name: Native Release tests
        run: ctest --preset linux-release-user
      - name: Install native SDK
        run: cmake --build --preset install-linux-release-user --parallel 2
      - name: Assert no PDFium installation
        shell: bash
        run: |
          prefix="$RUNNER_TEMP/external/pkgs/quantapdf/release"
          test -f "$prefix/lib/cmake/QuantaPDF/QuantaPDFConfig.cmake"
          if grep -Ri -E '(libpdfium|_PDFium|quantapdf_pdfium)' "$prefix/lib/cmake/QuantaPDF"; then
            echo "PDFium consumer linkage remains in the exported CMake package" >&2
            exit 1
          fi
          if find "$prefix" -type f -iname '*pdfium*' | grep .; then
            echo "PDFium binary or license artifact installed" >&2
            exit 1
          fi
      - name: Native ASan/UBSan configure
        run: cmake --fresh --preset linux-dev-user
      - name: Native ASan/UBSan build
        run: cmake --build --preset linux-dev-user --parallel 2
      - name: Native ASan/UBSan tests
        run: ctest --preset linux-dev-user

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore vcpkg binary cache
        id: vcpkg-cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/vcpkg-binary-cache
          key: vcpkg-native-${{ runner.os }}-${{ runner.arch }}-${{ env.VCPKG_COMMIT }}-${{ hashFiles('vcpkg.json') }}
      - name: Configure cache
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/vcpkg-binary-cache"
          echo "VCPKG_DEFAULT_BINARY_CACHE=$RUNNER_TEMP/vcpkg-binary-cache" >> "$GITHUB_ENV"
      - name: Bootstrap pinned vcpkg
        shell: bash
        run: |
          git init "$RUNNER_TEMP/vcpkg"
          git -C "$RUNNER_TEMP/vcpkg" remote add origin https://github.com/microsoft/vcpkg.git
          git -C "$RUNNER_TEMP/vcpkg" fetch --depth 1 origin "$VCPKG_COMMIT"
          git -C "$RUNNER_TEMP/vcpkg" checkout --detach FETCH_HEAD
          "$RUNNER_TEMP/vcpkg/bootstrap-vcpkg.sh" -disableMetrics
          echo "VCPKG_ROOT=$RUNNER_TEMP/vcpkg" >> "$GITHUB_ENV"
          echo "PROJECT_ROOT=$RUNNER_TEMP" >> "$GITHUB_ENV"
      - name: Select native preset
        shell: bash
        run: |
          case "$(uname -m)" in
            arm64) echo 'VCPKG_TRIPLET=arm64-osx' >> "$GITHUB_ENV"
                   echo 'NATIVE_PRESET=macos-arm64-release-user' >> "$GITHUB_ENV" ;;
            x86_64) echo 'VCPKG_TRIPLET=x64-osx' >> "$GITHUB_ENV"
                    echo 'NATIVE_PRESET=macos-x64-release-user' >> "$GITHUB_ENV" ;;
            *) exit 1 ;;
          esac
      - name: Install qpdf
        shell: bash
        run: |
          "$VCPKG_ROOT/vcpkg" install --triplet "$VCPKG_TRIPLET"
      - name: Save vcpkg binary cache
        if: steps.vcpkg-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/vcpkg-binary-cache
          key: ${{ steps.vcpkg-cache.outputs.cache-primary-key }}
      - name: Configure
        run: cmake --fresh --preset "$NATIVE_PRESET"
      - name: Build
        run: cmake --build --preset "$NATIVE_PRESET" --parallel 2
      - name: Native tests
        run: ctest --preset "$NATIVE_PRESET"
      - name: Install native SDK and audit
        shell: bash
        run: |
          cmake --install build/macos-clang-release
          prefix="$RUNNER_TEMP/external/pkgs/quantapdf/release"
          test -f "$prefix/lib/cmake/QuantaPDF/QuantaPDFConfig.cmake"
          if grep -Ri -E '(libpdfium|_PDFium|quantapdf_pdfium)' "$prefix/lib/cmake/QuantaPDF"; then
            exit 1
          fi
          if find "$prefix" -type f -iname '*pdfium*' | grep .; then
            exit 1
          fi

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore vcpkg binary cache
        id: vcpkg-cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/vcpkg-binary-cache
          key: vcpkg-native-${{ runner.os }}-${{ runner.arch }}-${{ env.VCPKG_COMMIT }}-${{ hashFiles('vcpkg.json') }}
      - name: Configure vcpkg binary cache
        shell: pwsh
        run: |
          $cache = Join-Path $env:RUNNER_TEMP "vcpkg-binary-cache"
          New-Item -ItemType Directory -Force -Path $cache | Out-Null
          "VCPKG_DEFAULT_BINARY_CACHE=$cache" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Bootstrap pinned vcpkg
        shell: pwsh
        run: |
          $root = Join-Path $env:RUNNER_TEMP "vcpkg"
          git init $root
          git -C $root remote add origin https://github.com/microsoft/vcpkg.git
          git -C $root fetch --depth 1 origin $env:VCPKG_COMMIT
          git -C $root checkout --detach FETCH_HEAD
          & "$root\bootstrap-vcpkg.bat" -disableMetrics
          "VCPKG_ROOT=$root" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "PROJECT_ROOT=$env:RUNNER_TEMP" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Install qpdf
        shell: pwsh
        run: '& "$env:VCPKG_ROOT\vcpkg.exe" install --triplet x64-windows-static-md'
      - name: Save vcpkg binary cache
        if: steps.vcpkg-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/vcpkg-binary-cache
          key: ${{ steps.vcpkg-cache.outputs.cache-primary-key }}
      - name: Locate Visual Studio environment
        shell: pwsh
        run: |
          $vswhere = Join-Path ${env:ProgramFiles(x86)} "Microsoft Visual Studio\Installer\vswhere.exe"
          $installation = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $installation) { throw "MSVC toolchain not found" }
          $vsdev = Join-Path $installation "Common7\Tools\VsDevCmd.bat"
          "VSDEVCMD=$vsdev" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Configure native DLL
        shell: cmd
        run: call "%VSDEVCMD%" -arch=x64 -host_arch=x64 >nul && cmake --fresh --preset win-release-user
      - name: Build native DLL
        shell: cmd
        run: call "%VSDEVCMD%" -arch=x64 -host_arch=x64 >nul && cmake --build --preset win-release-user --parallel 2
      - name: Native CTest
        shell: cmd
        run: call "%VSDEVCMD%" -arch=x64 -host_arch=x64 >nul && ctest --preset win-release-user
      - name: Install native SDK
        shell: cmd
        run: call "%VSDEVCMD%" -arch=x64 -host_arch=x64 >nul && cmake --build --preset install-win-release-user
      - name: Audit no PDFium artifacts
        shell: pwsh
        run: |
          $prefix = Join-Path $env:RUNNER_TEMP 'external\pkgs\quantapdf\release'
          $config = Join-Path $prefix 'lib\cmake\QuantaPDF\QuantaPDFConfig.cmake'
          if (-not (Test-Path $config)) { throw 'Missing native CMake package' }
          if (Select-String -Path $config -Pattern 'PDFium|quantapdf_pdfium') { throw 'PDFium target is exported' }
          $files = @(Get-ChildItem -Path $prefix -Recurse -File | Where-Object { $_.Name -match '(?i)pdfium' })
          if ($files.Count -ne 0) { throw 'PDFium binary installed' }
