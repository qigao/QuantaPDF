name: Probe licensed Commons PDFs for W-star
on:
  push:
    branches:
      - probe/262-pgf-corpus
permissions:
  contents: read
jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned discovery-only parser
        run: python3 -m pip install --disable-pip-version-check "pypdf==5.9.0"
      - name: Download three unchanged Commons originals
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/commons-pdfs
          curl --fail --location --retry 3 --retry-all-errors --max-time 90 \
            'https://commons.wikimedia.org/wiki/Special:Redirect/file/9chick_labyrinth1.pdf' \
            --output /tmp/commons-pdfs/9chick_labyrinth1.pdf
          curl --fail --location --retry 3 --retry-all-errors --max-time 90 \
            'https://commons.wikimedia.org/wiki/Special:Redirect/file/In-CC0.pdf' \
            --output /tmp/commons-pdfs/In-CC0.pdf
          curl --fail --location --retry 3 --retry-all-errors --max-time 90 \
            'https://commons.wikimedia.org/wiki/Special:Redirect/file/Silhouette.pdf' \
            --output /tmp/commons-pdfs/Silhouette.pdf
          file /tmp/commons-pdfs/*.pdf
      - name: Scan decoded content and print immutable source identities
        run: |
          python3 tools/qualification/probe_pgf_candidates.py \
            --root /tmp/commons-pdfs \
            --output commons-wstar-scan-report.json > commons-wstar-scan.log
      - name: Require all candidates to be accounted for
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          expected = {"9chick_labyrinth1.pdf", "In-CC0.pdf", "Silhouette.pdf"}
          report = json.loads(Path("commons-wstar-scan-report.json").read_text())
          results = report["results"]
          assert report["files_scanned"] == len(expected), report["files_scanned"]
          assert {Path(item["path"]).name for item in results} == expected
          assert report["files_scanned"] == (
              report["confirmed_no_wstar"] + report["wstar_found"] +
              report["inconclusive"]
          )
          print(json.dumps({
              key: report[key] for key in (
                  "files_scanned", "confirmed_no_wstar", "wstar_found", "inconclusive"
              )
          }, indent=2))
          for item in results:
              print(json.dumps({
                  "file": Path(item["path"]).name,
                  "bytes": item["bytes"],
                  "sha256": item["sha256"],
                  "scan_status": item["scan_status"],
                  "reason": item["reason"],
                  "pages": item["page_count"],
                  "page_content_wstar_count": item["page_content_wstar_count"],
                  "form_wstar_count": item["form_wstar_count"],
                  "page_text_operator_count": item["page_text_operator_count"],
                  "native_raster_risks": sorted({
                      risk for page in item["pages"]
                      for risk in page["native_raster_risks"]
                  }),
                  "clip_evidence": [
                      evidence for page in item["pages"]
                      for evidence in page["clip_evidence"]
                  ],
              }, sort_keys=True))
          PY
      - name: Retain quarantined report and rights metadata
        uses: actions/upload-artifact@v4
        with:
          name: commons-wstar-source-scan
          path: |
            commons-wstar-scan-report.json
            commons-wstar-scan.log
            tests/external_wstar_candidates/commons-pdf-source-metadata.json
          retention-days: 7
