name: Probe licensed interpolation PDF for W-star
on:
  push:
    branches:
      - probe/262-pgf-corpus
    paths:
      - 'tests/external_wstar_candidates/commons-interpolation-source-metadata.json'
permissions:
  contents: read
jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned parser and independent PDF validator
        run: |
          python3 -m pip install --disable-pip-version-check "pypdf==5.9.0"
          sudo apt-get update
          sudo apt-get install --yes qpdf
      - name: Download original and record exact source identity
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/commons-interpolation-pdf
          curl --fail --location --retry 3 --retry-all-errors --max-time 90 \
            'https://commons.wikimedia.org/wiki/Special:Redirect/file/INTERPOLATION%20LINEAIRE.pdf' \
            --output '/tmp/commons-interpolation-pdf/INTERPOLATION LINEAIRE.pdf'
          file '/tmp/commons-interpolation-pdf/INTERPOLATION LINEAIRE.pdf'
          bytes="$(wc -c < '/tmp/commons-interpolation-pdf/INTERPOLATION LINEAIRE.pdf')"
          test "$bytes" -ge 10000
          test "$bytes" -le 100000
          sha256sum '/tmp/commons-interpolation-pdf/INTERPOLATION LINEAIRE.pdf' | tee source-sha256.txt
      - name: Validate original independently before allowing pypdf recovery
        shell: bash
        run: |
          set -euo pipefail
          set +e
          qpdf --check '/tmp/commons-interpolation-pdf/INTERPOLATION LINEAIRE.pdf' > qpdf-check.log 2>&1
          qpdf_rc=$?
          set -e
          printf '%s\n' "$qpdf_rc" > qpdf-check-exit.txt
          cat qpdf-check.log
          printf 'qpdf_check_exit=%s\n' "$qpdf_rc"
          if [ "$qpdf_rc" -eq 0 ]; then
            python3 tools/qualification/probe_pgf_candidates.py \
              --root /tmp/commons-interpolation-pdf \
              --allow-nonzero-xref-warning \
              --max-operations 500000 \
              --output interpolation-wstar-scan-report.json > interpolation-wstar-scan.log
          else
            python3 tools/qualification/probe_pgf_candidates.py \
              --root /tmp/commons-interpolation-pdf \
              --max-operations 500000 \
              --output interpolation-wstar-scan-report.json > interpolation-wstar-scan.log
          fi
      - name: Require the candidate to be accounted for
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path("interpolation-wstar-scan-report.json").read_text())
          assert report["files_scanned"] == 1, report["files_scanned"]
          assert report["files_scanned"] == (
              report["confirmed_no_wstar"] + report["wstar_found"] +
              report["inconclusive"]
          )
          item = report["results"][0]
          print(json.dumps({
              "qpdf_check_exit": Path("qpdf-check-exit.txt").read_text().strip(),
              "file": Path(item["path"]).name,
              "bytes": item["bytes"],
              "sha256": item["sha256"],
              "scan_status": item["scan_status"],
              "reason": item["reason"],
              "pages": item["page_count"],
              "page_content_wstar_count": item["page_content_wstar_count"],
              "form_wstar_count": item["form_wstar_count"],
              "annotation_appearance_wstar_count": item["annotation_appearance_wstar_count"],
              "effective_wstar_count": item["effective_wstar_count"],
              "page_text_operator_count": item["page_text_operator_count"],
              "native_raster_risks": sorted({
                  risk for page in item["pages"]
                  for risk in page["native_raster_risks"]
              }),
              "page_operator_counts": [
                  {"page": page["index"], "operators": page["operator_counts"],
                   "risk_operators": page["risk_operator_counts"]}
                  for page in item["pages"]
              ],
              "clip_evidence": [
                  evidence for page in item["pages"]
                  for evidence in page["clip_evidence"]
              ],
          }, sort_keys=True))
          PY
      - name: Retain quarantined scan evidence and source metadata
        uses: actions/upload-artifact@v4
        with:
          name: interpolation-wstar-scan
          path: |
            qpdf-check.log
            qpdf-check-exit.txt
            source-sha256.txt
            interpolation-wstar-scan-report.json
            interpolation-wstar-scan.log
            tests/external_wstar_candidates/commons-interpolation-source-metadata.json
          retention-days: 7
