name: Probe licensed TeXample clipping PDFs for W-star
on:
  push:
    branches:
      - probe/262-pgf-corpus
    paths:
      - '.github/workflows/probe-texample-wstar.yml'
      - 'tests/external_wstar_candidates/texample-source-metadata.json'
permissions:
  contents: read
jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned parser and independent PDF validator
        run: |
          python3 -m pip install --disable-pip-version-check "pypdf==5.9.0"
          sudo apt-get update
          sudo apt-get install --yes qpdf
      - name: Download unchanged TeXample originals and hash
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/texample-pdfs
          curl --fail --location --retry 3 --retry-all-errors --max-time 90 \
            'https://texample.net/files/puzzle.pdf' \
            --output '/tmp/texample-pdfs/puzzle.pdf'
          curl --fail --location --retry 3 --retry-all-errors --max-time 90 \
            'https://texample.net/files/the-olympic-rings.pdf' \
            --output '/tmp/texample-pdfs/the-olympic-rings.pdf'
          file /tmp/texample-pdfs/*.pdf
          sha256sum /tmp/texample-pdfs/*.pdf | tee source-sha256.txt
      - name: Independently validate originals and scan decoded operators
        shell: bash
        run: |
          set -euo pipefail
          : > qpdf-validation.txt
          for pdf in /tmp/texample-pdfs/*.pdf; do
            name="$(basename "$pdf")"
            set +e
            qpdf --check "$pdf" > "qpdf-$name.log" 2>&1
            rc=$?
            set -e
            printf '%s=%s\n' "$name" "$rc" | tee -a qpdf-validation.txt
            cat "qpdf-$name.log"
          done
          python3 tools/qualification/probe_pgf_candidates.py \
            --root /tmp/texample-pdfs \
            --max-operations 500000 \
            --output texample-wstar-scan-report.json > texample-wstar-scan.log
      - name: Require both candidates to be accounted for
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path("texample-wstar-scan-report.json").read_text())
          expected = {"puzzle.pdf", "the-olympic-rings.pdf"}
          assert report["files_scanned"] == len(expected), report["files_scanned"]
          assert {Path(item["path"]).name for item in report["results"]} == expected
          assert report["files_scanned"] == (
              report["confirmed_no_wstar"] + report["wstar_found"] +
              report["inconclusive"]
          )
          print(json.dumps({
              "files_scanned": report["files_scanned"],
              "confirmed_no_wstar": report["confirmed_no_wstar"],
              "wstar_found": report["wstar_found"],
              "inconclusive": report["inconclusive"],
              "qpdf_validation": Path("qpdf-validation.txt").read_text().splitlines(),
              "results": [{
                  "file": Path(item["path"]).name,
                  "bytes": item["bytes"],
                  "sha256": item["sha256"],
                  "scan_status": item["scan_status"],
                  "reason": item["reason"],
                  "pages": item["page_count"],
                  "page_content_wstar_count": item["page_content_wstar_count"],
                  "form_wstar_count": item["form_wstar_count"],
                  "annotation_appearance_wstar_count": item["annotation_appearance_wstar_count"],
                  "effective_wstar_count": item["effective_wstar_count"],
                  "page_text_operator_count": item["page_text_operator_count"],
                  "native_raster_risks": sorted({
                      risk for page in item["pages"]
                      for risk in page["native_raster_risks"]
                  }),
                  "page_operator_counts": [
                      {"page": page["index"], "operators": page["operator_counts"],
                       "risk_operators": page["risk_operator_counts"]}
                      for page in item["pages"]
                  ],
                  "clip_evidence": [
                      evidence for page in item["pages"]
                      for evidence in page["clip_evidence"]
                  ],
              } for item in report["results"]],
          }, sort_keys=True, indent=2))
          PY
      - name: Retain quarantined scan evidence
        uses: actions/upload-artifact@v4
        with:
          name: texample-wstar-scan
          path: |
            source-sha256.txt
            qpdf-validation.txt
            qpdf-*.log
            texample-wstar-scan-report.json
            texample-wstar-scan.log
            tests/external_wstar_candidates/texample-source-metadata.json
          retention-days: 7
